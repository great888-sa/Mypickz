name: Deploy pulse worker (pulse.mypickz.app)

on:
  push:
    branches: [main]
    paths:
      - "workers/pulse/**"
      - ".github/workflows/deploy-pulse.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check workers/pulse/src/index.js
      - name: Dry-run deploy (validates config and bindings)
        run: npx wrangler@4 deploy --dry-run --config workers/pulse/wrangler.toml --outdir /tmp/pulse-dry

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/pulse
          command: deploy --var ALERT_TO:${{ secrets.ALERT_TO }}
