# MyPickz — هجرة أماكن الدليل (cities/{id}.links) إلى قوائم المالك منتقيًا (ز-١-ج-١) — يدوي فقط · dry ثم apply · السرّ FIREBASE_SA_KEY (حساب خدمة محدود) يُحذف بعد الاستعمال في اليوم نفسه
name: Migrate directory
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (no writes) or apply'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      owner:
        description: 'owner uid (curator account)'
        required: true
        default: 'UJHk3DqwmDeLptTnTYXwLQjBvHx1'
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@12 >/dev/null 2>&1
      - name: Backup cities collection (JSON artifact — restorable)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          umask 077; printf '%s' "$FIREBASE_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          node -e "
          const admin=require('firebase-admin'); admin.initializeApp(); const db=admin.firestore();
          (async()=>{ const snap=await db.collection('cities').get(); const out={}; snap.forEach(d=>{ out[d.id]=d.data(); }); require('fs').writeFileSync('cities-backup.json', JSON.stringify({ exportedAt: new Date().toISOString(), count: snap.size, cities: out }, null, 1)); console.log('backup: cities docs', snap.size); })();"
          rm -f /tmp/sa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cities-backup
          path: cities-backup.json
      - name: Run migration (${{ github.event.inputs.mode }})
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$FIREBASE_SA_KEY" ]; then echo "FIREBASE_SA_KEY secret missing"; exit 2; fi
          umask 077; printf '%s' "$FIREBASE_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then node scripts/migrate-directory.js --owner=${{ github.event.inputs.owner }}; else node scripts/migrate-directory.js --owner=${{ github.event.inputs.owner }} --dry; fi
          rm -f /tmp/sa.json
