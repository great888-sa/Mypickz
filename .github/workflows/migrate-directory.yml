# MyPickz — هجرة أماكن الدليل (cities/{id}.links) إلى قوائم المالك منتقيًا (ز-١-ج-١) ثم حذف المجموعة (ر٧٣-د) — يدوي فقط · dry ثم apply · ثم purge بتأكيد DELETE
# السرّ FIREBASE_SA_KEY (حساب خدمة محدود) يُحذف بعد الاستعمال في اليوم نفسه · النسخة الاحتياطية cities-backup.json تُؤخذ قبل كل وضع وتُنزَّل من صفحة التشغيلة (تبقى ٩٠ يومًا)
name: Migrate directory
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (no writes) · apply (migrate) · purge (ر٧٣-د: verify then delete cities + legacy settings docs; without confirm=DELETE it only verifies)'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply, purge]
      owner:
        description: 'owner uid (curator account)'
        required: true
        default: 'UJHk3DqwmDeLptTnTYXwLQjBvHx1'
      confirm:
        description: 'purge only: DELETE = verify then delete · DELETE-ALLOW-MISSING = delete even if some old-directory places are missing from the owner lists (owner decision, names printed) · anything else = verify-only report'
        required: false
        default: ''
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@12 >/dev/null 2>&1
      - name: Backup cities collection (JSON artifact — restorable)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$FIREBASE_SA_KEY" ]; then echo "FIREBASE_SA_KEY secret missing"; exit 2; fi
          umask 077; printf '%s' "$FIREBASE_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          node -e "
          const admin=require('firebase-admin'); admin.initializeApp(); const db=admin.firestore();
          (async()=>{ const snap=await db.collection('cities').get(); const out={}; snap.forEach(d=>{ out[d.id]=d.data(); }); const settings={}; for (const id of ['cities-list','countries-list','publish-status']){ const d=await db.collection('settings').doc(id).get(); if (d.exists) settings[id]=d.data(); } require('fs').writeFileSync('cities-backup.json', JSON.stringify({ exportedAt: new Date().toISOString(), count: snap.size, cities: out, settings }, null, 1)); console.log('backup: cities docs', snap.size, '· settings docs', Object.keys(settings).length); })();"
          rm -f /tmp/sa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cities-backup
          path: cities-backup.json
      - name: Run migration (${{ github.event.inputs.mode }})
        if: github.event.inputs.mode != 'purge'
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          umask 077; printf '%s' "$FIREBASE_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then node scripts/migrate-directory.js --owner=${{ github.event.inputs.owner }}; else node scripts/migrate-directory.js --owner=${{ github.event.inputs.owner }} --dry; fi
          rm -f /tmp/sa.json
      - name: Purge cities (ر٧٣-د — verify first; deletes only with confirm=DELETE)
        if: github.event.inputs.mode == 'purge'
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          umask 077; printf '%s' "$FIREBASE_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          case "${{ github.event.inputs.confirm }}" in
            DELETE) echo "confirm=DELETE — verify then delete"; node scripts/purge-directory.js --owner=${{ github.event.inputs.owner }} ;;
            DELETE-ALLOW-MISSING) echo "confirm=DELETE-ALLOW-MISSING — delete; missing old-directory places accepted by owner decision (9 Oct 2026)"; node scripts/purge-directory.js --owner=${{ github.event.inputs.owner }} --allow-missing ;;
            *) echo "no confirm — verify-only report (nothing deleted)"; node scripts/purge-directory.js --owner=${{ github.event.inputs.owner }} --dry ;;
          esac
          rm -f /tmp/sa.json
