# MyPickz — تجهيز بيانات الأماكن بالمناطق الكاملة (ز-١-ج-١ v1.2) → شظايا خلايا مضغوطة → R2 · يدوي بمنطقة/دولة، وشهري كامل بعد إصدار Overture (اليوم ٢٦) · الإصدار المثبَّت
name: Places publish (R2)
on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'regions: first_market,europe,usa (empty = all three)'
        required: false
        default: ''
      countries:
        description: 'or country codes: SA,BH (overrides regions)'
        required: false
        default: ''
  schedule:
    - cron: "0 2 26 * *"
concurrency:
  group: places-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DuckDB + wrangler
        run: pip install duckdb==1.1.3
      - name: Install rclone (early) + pull current cells manifest (accumulate)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p scripts/eval/r2/cells
          rclone copyto r2:mypickz-places/cells/manifest.json scripts/eval/r2/cells/manifest.json 2>/dev/null || echo '{"cells":{}}' > scripts/eval/r2/cells/manifest.json
          python3 -c "import json; m=json.load(open('scripts/eval/r2/cells/manifest.json')); print('manifest cells before:', len(m.get('cells',{})))"
      - name: Extract by regions/countries (pinned release)
        run: |
          if [ -n "${{ github.event.inputs.countries }}" ]; then python scripts/overture-extract.py --countries=${{ github.event.inputs.countries }};
          elif [ -n "${{ github.event.inputs.regions }}" ]; then python scripts/overture-extract.py --regions=${{ github.event.inputs.regions }};
          else python scripts/overture-extract.py --regions=first_market,europe,usa; fi
      - name: Index cells (gz)
        run: node scripts/overture-index.mjs
      - name: Upload cells to R2 (rclone · parallel · skips existing)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          cd scripts/eval/r2
          total=$(find cells -type f -name '*.json.gz' | wc -l); echo "cell files: $total"
          rclone copy cells r2:mypickz-places/cells --ignore-existing --transfers 48 --checkers 48 --exclude manifest.json --stats 60s --stats-one-line
          rclone copyto cells/manifest.json r2:mypickz-places/cells/manifest.json
          du -sh cells | cut -f1 | xargs -I{} echo "size (gz): {}"
          echo "upload finished"
