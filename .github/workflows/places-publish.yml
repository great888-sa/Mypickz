# MyPickz — تجهيز بيانات الأماكن بالمناطق الكاملة (ز-١-ج-١ v1.2) → شظايا خلايا مضغوطة → R2 · يدوي بمنطقة/دولة، وشهري كامل بعد إصدار Overture (اليوم ٢٦) · الإصدار المثبَّت
name: Places publish (R2)
on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'regions: first_market,europe,usa (empty = all three)'
        required: false
        default: ''
      countries:
        description: 'or country codes: SA,BH (overrides regions)'
        required: false
        default: ''
  schedule:
    - cron: "0 2 26 * *"
concurrency:
  group: places-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DuckDB + wrangler
        run: pip install duckdb==1.1.3 && npm install --no-save wrangler@4 >/dev/null 2>&1
      - name: Pull current cells manifest (accumulate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p scripts/eval/r2/cells && (npx --no-install wrangler r2 object get "mypickz-places/cells/manifest.json" --file scripts/eval/r2/cells/manifest.json --remote >/dev/null 2>&1 || echo '{"cells":{}}' > scripts/eval/r2/cells/manifest.json)
      - name: Extract by regions/countries (pinned release)
        run: |
          if [ -n "${{ github.event.inputs.countries }}" ]; then python scripts/overture-extract.py --countries=${{ github.event.inputs.countries }};
          elif [ -n "${{ github.event.inputs.regions }}" ]; then python scripts/overture-extract.py --regions=${{ github.event.inputs.regions }};
          else python scripts/overture-extract.py --regions=first_market,europe,usa; fi
      - name: Index cells (gz)
        run: node scripts/overture-index.mjs
      - name: Upload cells to R2 (8 in parallel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd scripts/eval/r2
          total=$(find cells -type f -name '*.json.gz' | wc -l); echo "cell files: $total"
          find cells -type f -name '*.json.gz' | sort | xargs -P 8 -I{} sh -c 'npx --no-install wrangler r2 object put "mypickz-places/{}" --file "{}" --content-type application/json --remote >/dev/null 2>&1 || npx --no-install wrangler r2 object put "mypickz-places/{}" --file "{}" --content-type application/json --remote >/dev/null 2>&1 || echo "FAILED {}"'
          npx --no-install wrangler r2 object put "mypickz-places/cells/manifest.json" --file cells/manifest.json --content-type application/json --remote >/dev/null 2>&1
          du -sh cells | cut -f1 | xargs -I{} echo "size uploaded (gz): {}"
          echo "upload finished"
