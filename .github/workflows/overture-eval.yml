# MyPickz — قياس المطابقة على المجموعة الذهبية بالتقسيم بالخلايا (ز-١-ج-١ v1.2 · القياس أ) — بلا مفتاح · الإصدار المثبَّت
name: Overture eval
on:
  workflow_dispatch:
    inputs:
      min:
        description: 'reject below this score'
        required: false
        default: '0.55'
      max:
        description: 'max meters counted as correct'
        required: false
        default: '300'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DuckDB
        run: pip install duckdb==1.1.3
      - name: Golden cities list (18) from cities-bbox centers
        run: |
          python - <<'PY'
          import json
          bb = json.load(open('scripts/eval/cities-bbox.json', encoding='utf-8')); bb.pop('note', None)
          cities = []
          for cid, b in bb.items():
              cities.append({'id': cid, 'n': cid, 'lat': (b[1] + b[3]) / 2, 'lng': (b[0] + b[2]) / 2, 'p': 1500000})
          json.dump({'cities': cities}, open('/tmp/golden-cities.json', 'w'))
          print(len(cities), 'cities')
          PY
      - name: Extract (city boxes → cells)
        run: python scripts/overture-extract.py --cities=/tmp/golden-cities.json
      - name: Index cells
        run: node scripts/overture-index.mjs
      - name: Score (cells)
        run: node scripts/match-score.js --source=cells --min=${{ github.event.inputs.min }} --max=${{ github.event.inputs.max }} || true
      - uses: actions/upload-artifact@v4
        with:
          name: overture-tuning
          path: |
            scripts/eval/score-report-cells.json
            scripts/eval/score-cands-cells.json
          if-no-files-found: warn
