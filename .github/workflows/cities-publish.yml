# MyPickz — المعجم المُثرى (ز-١-ج-١): بناء cities/<CC>.json من GeoNames (المعرّف · الإحداثيات · العربي) وشظايا البحث إلى R2 · يدوي (فصليًّا) · يلتزم الملفات بالمستودع
name: Cities publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build gazetteer (GeoNames cities500 + Arabic names)
        run: python scripts/gazetteer-build.py
      - name: Commit enriched cities/<CC>.json
        run: |
          git config user.name "mypickz-bot"; git config user.email "bot@mypickz.app"
          git add cities/*.json
          git commit -m "Cities: enriched gazetteer (id, coordinates, Arabic names) + base cities list" || echo "nothing to commit"
          git push
      - name: Upload search shards + manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save wrangler@4 >/dev/null 2>&1
          cd scripts/eval/gaz
          echo "{\"builtAt\":\"$(date -u +%FT%TZ)\",\"source\":\"GeoNames cities500 (CC BY 4.0)\"}" > manifest.json
          npx --no-install wrangler r2 object put "mypickz-places/gaz/manifest.json" --file manifest.json --content-type application/json --remote >/dev/null 2>&1
          total=$(find idx -type f -name '*.json' | wc -l); echo "shards: $total"
          find idx -type f -name '*.json' | sort | xargs -P 8 -I{} sh -c 'npx --no-install wrangler r2 object put "mypickz-places/gaz/{}" --file "{}" --content-type application/json --remote >/dev/null 2>&1 || echo "FAILED {}"'
          echo "upload finished"
