name: Deploy test (test.mypickz.app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run static audit
        run: node tests/audit.js
      - name: Run runtime smoke (real Chrome, offline)
        run: node tests/runtime.js
      - name: Run visual contract (real Chrome — computed contrast, clipping, deferred, field-notes register)
        run: node tests/visual.js
      - name: Upload screenshots (visual-out)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: visual-out/
          if-no-files-found: error
      - name: Run Firestore rules tests (official emulator)
        run: npx firebase emulators:exec --only firestore --project demo-mypickz "node tests/rules-sim.js"
      - name: Run user journey (full simulation, no browser)
        run: node tests/journey.js

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
