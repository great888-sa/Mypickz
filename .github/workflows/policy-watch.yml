# MyPickz — مراقب السياسات (خ-٣): شهري (اليوم ١) · يجلب صفحات الشروط المسجَّلة بسجل التبعيات ويقارن بصمة نصها بالمحفوظة؛ تغيّر → السير أحمر (بريد GitHub) ويُرفق النص الجديد للمراجعة · بعد المراجعة تُلتزم البصمات الجديدة
name: Policy watch (monthly)
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      accept:
        description: 'true = accept current pages and commit new fingerprints'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch terms pages and compare fingerprints
        run: |
          python3 - <<'PY'
          import json, hashlib, re, urllib.request, sys, os
          deps = json.load(open('scripts/eval/dependencies.json', encoding='utf-8'))['deps']
          fp_path = 'scripts/eval/policy-fingerprints.json'; fps = json.load(open(fp_path)) if os.path.exists(fp_path) else {}
          accept = "${{ github.event.inputs.accept }}" == 'true'; changed = []; os.makedirs('/tmp/policy', exist_ok=True)
          for d in deps:
              try:
                  req = urllib.request.Request(d['terms'], headers={'User-Agent': 'Mozilla/5.0 (MyPickz policy watch)'}); html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
              except Exception as e: print(d['id'], 'FETCH FAILED', str(e)[:80]); continue
              text = re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>', '', html); text = re.sub(r'<[^>]+>', ' ', text); text = re.sub(r'\s+', ' ', text).strip()
              h = hashlib.sha256(text.encode()).hexdigest()[:16]; open(f"/tmp/policy/{d['id']}.txt", 'w').write(text[:20000])
              if d['id'] in fps and fps[d['id']] != h: changed.append(d['id']); print(d['id'], 'CHANGED', fps[d['id']], '→', h)
              else: print(d['id'], 'ok' if d['id'] in fps else 'first fingerprint', h)
              if accept or d['id'] not in fps: fps[d['id']] = h
          json.dump(fps, open(fp_path, 'w'), indent=1)
          if changed and not accept: print('POLICY CHANGED:', ', '.join(changed), '— review the attached text, then rerun with accept=true'); sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-pages
          path: /tmp/policy/
      - name: Commit fingerprints
        if: success()
        run: |
          git config user.name "mypickz-bot"; git config user.email "bot@mypickz.app"
          git add scripts/eval/policy-fingerprints.json && (git commit -m "Policy watch: fingerprints" && git push) || echo "no change"
