# MyPickz — قياس حل روابط جوجل عبر العامل الحي (ز-١) — عينة ١٥٠ رابطًا بأسمائها المعروفة · بلا مفتاح
name: Resolve eval
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'max links (0 = all 150)'
        required: false
        default: '0'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve sample through places.mypickz.app
        run: node scripts/resolve-eval.mjs --limit=${{ github.event.inputs.limit }} || true
      - uses: actions/upload-artifact@v4
        with:
          name: resolve-report
          path: scripts/eval/resolve-report.json
          if-no-files-found: warn
