# MyPickz — نشر عامل النسخ الاحتياطي (backup.mypickz.app) — r100-و (ق١١-٠٣-٠٩)
# الأسرار المطلوبة في GitHub: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · ALERT_TO (موجودة للنبضة) · FIREBASE_SA_KEY (جديد: JSON حساب خدمة بدور Cloud Datastore Viewer فقط)
name: Deploy backup worker (backup.mypickz.app)

on:
  push:
    branches: [main]
    paths:
      - "workers/backup/**"
      - ".github/workflows/deploy-backup.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check workers/backup/src/index.js
      - name: Local tests (JWT · paging · R2 · budget guard · prune · alert)
        run: cd workers/backup && node test.js
      - name: Dry-run deploy (validates config and bindings)
        run: npx wrangler@4 deploy --dry-run --config workers/backup/wrangler.toml --outdir /tmp/backup-dry

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret present?
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$FIREBASE_SA_KEY" ]; then echo "FIREBASE_SA_KEY secret missing — add it in GitHub → Settings → Secrets (service account JSON, role Cloud Datastore Viewer)"; exit 2; fi
      - name: Create the private bucket once (no-op if it exists)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/backup
          command: r2 bucket create mypickz-backups
        continue-on-error: true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/backup
          command: deploy --var ALERT_TO:${{ secrets.ALERT_TO }}
          secrets: |
            FIREBASE_SA_KEY
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
