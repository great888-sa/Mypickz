# MyPickz — الخلفي كل ساعة (ز-١-ج-١ · قرار المالك): أي مدينة طلبها مستخدم ولا بيانات لها تُجهَّز تلقائيًّا — خروج مبكر بلا طلبات · قفل تزامن
name: Places backfill (hourly)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: places-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Any requests? (early exit)
        id: req
        run: |
          curl -s https://places.mypickz.app/requests > /tmp/req.json || echo '{"cities":[]}' > /tmp/req.json
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/req.json')).get('cities',[])))"); echo "requests=$n"; echo "n=$n" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.req.outputs.n != '0'
      - uses: actions/setup-python@v5
        if: steps.req.outputs.n != '0'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.req.outputs.n != '0'
        with:
          node-version: '20'
      - name: Requested cities → list file
        if: steps.req.outputs.n != '0'
        run: |
          pip install duckdb==1.1.3 >/dev/null && npm install --no-save wrangler@4 >/dev/null 2>&1
          python - <<'PY'
          import json, glob
          req = set(json.load(open('/tmp/req.json')).get('cities', []))
          out = []
          for f in glob.glob('cities/*.json'):
              cc = f.split('/')[-1][:-5]
              for e in json.load(open(f, encoding='utf-8')):
                  if str(e['id']) in req: out.append({'id': e['id'], 'n': e['n'], 'cc': cc, 'lat': e['lat'], 'lng': e['lng'], 'p': e.get('p', 0)})
          json.dump({'cities': out}, open('/tmp/req-cities.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('requested cities found in gazetteer:', len(out))
          PY
      - name: Pull manifest, extract, index, upload
        if: steps.req.outputs.n != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/eval/r2/cells && (npx --no-install wrangler r2 object get "mypickz-places/cells/manifest.json" --file scripts/eval/r2/cells/manifest.json --remote >/dev/null 2>&1 || echo '{"cells":{}}' > scripts/eval/r2/cells/manifest.json)
          python scripts/overture-extract.py --cities=/tmp/req-cities.json
          node scripts/overture-index.mjs
          cd scripts/eval/r2
          find cells -type f -name '*.json.gz' | sort | xargs -P 8 -I{} sh -c 'npx --no-install wrangler r2 object put "mypickz-places/{}" --file "{}" --content-type application/json --remote >/dev/null 2>&1 || echo "FAILED {}"'
          npx --no-install wrangler r2 object put "mypickz-places/cells/manifest.json" --file cells/manifest.json --content-type application/json --remote >/dev/null 2>&1
          for c in $(python -c "import json;print(' '.join(json.load(open('/tmp/req-cities.json'))['cities'] and [str(x['id']) for x in json.load(open('/tmp/req-cities.json'))['cities']] or []))"); do npx --no-install wrangler r2 object delete "mypickz-places/req/$c" --remote >/dev/null 2>&1 || true; done
          echo "backfill finished"
