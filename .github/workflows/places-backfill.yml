# MyPickz — الخلفي كل ساعة (ز-١-ج-١ · قرار المالك): أي مدينة طلبها مستخدم ولا بيانات لها تُجهَّز تلقائيًّا — خروج مبكر بلا طلبات · قفل تزامن
name: Places backfill (hourly)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: places-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Any requests? (early exit)
        id: req
        run: |
          curl -s https://places.mypickz.app/requests > /tmp/req.json || echo '{"cities":[]}' > /tmp/req.json
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/req.json')).get('cities',[])))"); echo "requests=$n"; echo "n=$n" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.req.outputs.n != '0'
      - uses: actions/setup-python@v5
        if: steps.req.outputs.n != '0'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.req.outputs.n != '0'
        with:
          node-version: '20'
      - name: Requested cities → list file
        if: steps.req.outputs.n != '0'
        run: |
          pip install duckdb==1.1.3 >/dev/null
          python - <<'PY'
          import json, glob
          req = set(json.load(open('/tmp/req.json')).get('cities', []))
          out = []
          for f in glob.glob('cities/*.json'):
              cc = f.split('/')[-1][:-5]
              for e in json.load(open(f, encoding='utf-8')):
                  if str(e['id']) in req: out.append({'id': e['id'], 'n': e['n'], 'cc': cc, 'lat': e['lat'], 'lng': e['lng'], 'p': e.get('p', 0)})
          json.dump({'cities': out}, open('/tmp/req-cities.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('requested cities found in gazetteer:', len(out))
          PY
      - name: Pull manifest, extract, index, upload (rclone)
        if: steps.req.outputs.n != '0'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p scripts/eval/r2/cells
          rclone copyto r2:mypickz-places/cells/manifest.json scripts/eval/r2/cells/manifest.json 2>/dev/null || echo '{"cells":{}}' > scripts/eval/r2/cells/manifest.json
          python scripts/overture-extract.py --cities=/tmp/req-cities.json
          node scripts/overture-index.mjs
          cd scripts/eval/r2
          rclone copy cells r2:mypickz-places/cells --transfers 32 --checkers 32 --exclude manifest.json --stats-one-line
          rclone copyto cells/manifest.json r2:mypickz-places/cells/manifest.json
          for c in $(python3 -c "import json;print(' '.join(str(x['id']) for x in json.load(open('/tmp/req-cities.json'))['cities']))"); do rclone deletefile "r2:mypickz-places/req/$c" 2>/dev/null || true; done
          echo "backfill finished"
