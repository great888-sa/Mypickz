name: Deploy places worker (places.mypickz.app)

on:
  push:
    branches: [main]
    paths:
      - "workers/places/**"
      - ".github/workflows/deploy-places.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (match logic · no network)
        run: node workers/places/test.js
      - name: Dry-run deploy (validates config and bindings)
        run: npx wrangler@4 deploy --dry-run --config workers/places/wrangler.toml --outdir /tmp/places-dry

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/places
          command: deploy
