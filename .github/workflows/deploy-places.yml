name: Deploy places worker (places.mypickz.app)

on:
  push:
    branches: [main]
    paths:
      - "workers/places/**"
      - ".github/workflows/deploy-places.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install worker dependencies (pmtiles)
        run: cd workers/places && npm install --no-audit --no-fund
      - name: Unit tests (match + tiles · no network)
        run: cd workers/places && npm test
      - name: Dry-run deploy (validates config, bindings and bundling)
        run: cd workers/places && npx wrangler@4 deploy --dry-run --outdir /tmp/places-dry

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd workers/places && npm install --no-audit --no-fund
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/places
          command: deploy
