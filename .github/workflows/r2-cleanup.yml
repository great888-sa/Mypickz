# MyPickz — حذف بادئة من المخزن يدويًّا (مثل cells/ بعد اعتماد الفهرس v2) — يطلب كتابة البادئة مرتين للتأكيد ويطبع الحجم قبل الحذف
name: R2 cleanup (manual)
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'prefix to delete (e.g. cells/)'
        required: true
      confirm:
        description: 'type the same prefix again to confirm'
        required: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Delete prefix
        run: |
          p="${{ github.event.inputs.prefix }}"; c="${{ github.event.inputs.confirm }}"
          if [ -z "$p" ] || [ "$p" != "$c" ]; then echo "prefix and confirm differ — nothing deleted"; exit 1; fi
          case "$p" in cells/|cells|ovt/|ovt|tok/*|tiles/*) ;; *) echo "prefix '$p' is not in the allowed list (cells/ · ovt/ · tok/<CC> · tiles/<CC>)"; exit 1;; esac
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone size "r2:mypickz-places/$p"
          rclone purge "r2:mypickz-places/$p" --transfers 64 --checkers 64 --stats-one-line
          echo "deleted $p"
